name: Sync PiSentinel checklists to Jira

on:
  workflow_dispatch:
  schedule:
    # Monday 10:00 IST
    - cron: "30 4 * * 1"
  push:
    paths:
      - "checklists/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sync pending checklist tasks
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: KAN
          JIRA_ASSIGNEE_A: ${{ secrets.JIRA_ASSIGNEE_A }}
          JIRA_ASSIGNEE_B: ${{ secrets.JIRA_ASSIGNEE_B }}
          JIRA_ASSIGNEE_C: ${{ secrets.JIRA_ASSIGNEE_C }}
          JIRA_ASSIGNEE_D: ${{ secrets.JIRA_ASSIGNEE_D }}
        run: python scripts/sync_jira.py
